<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEOWA — Une porte sur tout ton monde</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6, #7c3aed);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            box-shadow: 0 0 60px rgba(6, 182, 212, 0.4);
        }
        h1 { font-size: 48px; letter-spacing: 8px; margin-bottom: 10px; }
        .slogan { font-size: 18px; color: #cbd5e1; margin-bottom: 50px; font-style: italic; }
        .btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 16px 40px;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            margin: 8px;
            display: inline-block;
        }
        .btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .footer { margin-top: 60px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="logo">N</div>
    <h1>NEOWA</h1>
    <p class="slogan">Une porte sur tout ton monde</p>
    
    <div>
        <a href="#" class="btn">📱 Services</a>
        <a href="#" class="btn">🌐 Navigateur</a>
        <a href="#" class="btn">💳 Portefeuille</a>
    </div>
    
    <div class="footer">
        NEOWA © 2026 — Version 1.0
    </div>
</body>
</html>
